<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="wt wd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="wt">A 59% win rate still lost money</title>
  <desc id="wd">Copy-whale paper trades by entry price. Under 0.30: 12.3% win rate, minus 10.0% return. 0.30 to 0.60: 43.0% win rate, plus 15.5% return, which did not hold up in the forward test. 0.60 to 0.80: 71.2% win rate, minus 14.9% return. Over 0.80: 93.5% win rate, minus 1.3% return.</desc>
  <rect width="880" height="380" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="879" height="379" rx="13.5" fill="none" stroke="#30363d"/>
  <text x="40" y="48" fill="#e6edf3" font-size="20" font-weight="600">A 59% win rate still lost money</text>
  <text x="40" y="74" fill="#9198a1" font-size="14">Copy-whale paper trades by entry price. Favourites win often and pay pennies; one loss erases twenty wins.</text>

  <text x="40" y="118" fill="#7d8590" font-size="12" font-weight="600" letter-spacing="1">ENTRY PRICE</text>
  <text x="170" y="118" fill="#7d8590" font-size="12" font-weight="600" letter-spacing="1">WIN RATE</text>
  <text x="560" y="118" fill="#7d8590" font-size="12" font-weight="600" letter-spacing="1">RETURN ON INVESTMENT</text>

  <!-- win rate: x from 170, 2.6 px per point. ROI: zero at x=680, 5 px per point -->
  <line x1="680" y1="132" x2="680" y2="316" stroke="#484f58"/>

  <g font-size="14" fill="#e6edf3">
    <text x="40" y="157">under 0.30</text>
    <text x="40" y="203">0.30 – 0.60</text>
    <text x="40" y="249">0.60 – 0.80</text>
    <text x="40" y="295">over 0.80</text>
  </g>

  <g fill="#6cb6ff">
    <path d="M170 140 H198 a4 4 0 0 1 4 4 V158 a4 4 0 0 1 -4 4 H170 Z"/>
    <path d="M170 186 H277.8 a4 4 0 0 1 4 4 V204 a4 4 0 0 1 -4 4 H170 Z"/>
    <path d="M170 232 H351.1 a4 4 0 0 1 4 4 V250 a4 4 0 0 1 -4 4 H170 Z"/>
    <path d="M170 278 H409.1 a4 4 0 0 1 4 4 V296 a4 4 0 0 1 -4 4 H170 Z"/>

    <path d="M680 140 H634 a4 4 0 0 0 -4 4 V158 a4 4 0 0 0 4 4 H680 Z"/>
    <path d="M680 186 H753.5 a4 4 0 0 1 4 4 V204 a4 4 0 0 1 -4 4 H680 Z"/>
    <path d="M680 232 H609.5 a4 4 0 0 0 -4 4 V250 a4 4 0 0 0 4 4 H680 Z"/>
    <path d="M680 278 H677.5 a2 2 0 0 0 -2 2 V298 a2 2 0 0 0 2 2 H680 Z"/>
  </g>

  <g font-size="14" font-weight="600" fill="#e6edf3">
    <text x="210" y="157">12.3%</text>
    <text x="290" y="203">43.0%</text>
    <text x="363" y="249">71.2%</text>
    <text x="421" y="295">93.5%</text>

    <text x="622" y="157" text-anchor="end">−10.0%</text>
    <text x="766" y="203">+15.5%</text>
    <text x="597" y="249" text-anchor="end">−14.9%</text>
    <text x="667" y="295" text-anchor="end">−1.3%</text>
  </g>
  <text x="766" y="221" fill="#9198a1" font-size="11.5">failed forward</text>

  <text x="40" y="356" fill="#7d8590" font-size="12">Source: FINDINGS.md. The one profitable band became the mid-band strategy, which lost 18.1% with realistic fills.</text>
</svg>
